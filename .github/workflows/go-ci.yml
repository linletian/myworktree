name: Go CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      # Reasonix upstream contract check (opt-in, see
      # internal/instance/reasonix/contract_test.go): runners without a
      # reasonix binary skip it (green); once a binary is installed on the
      # runner this runs the full contract check on every push/PR.
      - name: Verify reasonix upstream contract (SKIPs when reasonix is absent)
        run: REASONIX_CONTRACT=1 go test ./internal/instance/reasonix/ -run TestReasonixUpstreamContract -v

      - name: Build binaries
        run: |
          go build -v -o /tmp/myworktree ./cmd/myworktree
          go build -v -o /tmp/mw ./cmd/mw
