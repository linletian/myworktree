<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="page-title">File Preview - myworktree</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #e1e4e8;
            --text-primary: #24292e;
            --text-secondary: #586069;
            --text-muted: #6a737d;
            --header-bg: #f6f8fa;
            --main-bg: #fff;
            --active-color: #005cc5;
            --tab-active-bg: #ffffff;
            --tab-bg: #f6f8fa;
            --tab-border: #e1e4e8;
            --hover-bg: #f6f8fa;
            --content-bg: #ffffff;
            --diff-add-bg: #e6ffec;
            --diff-add-text: #1a7f37;
            --diff-del-bg: #ffebe9;
            --diff-del-text: #cf222e;
            --diff-hunk: #0969da;
            --diff-header: #656d76;
            --code-bg: #f6f8fa;
            --error-bg: #ffebe9;
            --error-text: #cf222e;
            --loading-text: #656d76;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --border-color: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --text-muted: #6e7681;
                --header-bg: #161b22;
                --main-bg: #0d1117;
                --active-color: #58a6ff;
                --tab-active-bg: #0d1117;
                --tab-bg: #161b22;
                --tab-border: #30363d;
                --hover-bg: #161b22;
                --content-bg: #0d1117;
                --diff-add-bg: #1a3a2a;
                --diff-add-text: #3fb950;
                --diff-del-bg: #3a1a1a;
                --diff-del-text: #f85149;
                --diff-hunk: #58a6ff;
                --diff-header: #8b949e;
                --code-bg: #161b22;
                --error-bg: #3a1a1a;
                --error-text: #f85149;
                --loading-text: #8b949e;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px; color: var(--text-primary); background: var(--bg-color);
        }
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        #header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            flex-shrink: 0;
        }
        #header .header-line1 {
            font-size: 13px; font-weight: 500; color: var(--text-primary);
            display: flex; align-items: center; gap: 6px;
        }
        #header .header-line1 .sep { color: var(--text-muted); }
        #header .header-line1 .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
        #header .header-line2 {
            font-size: 11px; color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            margin-top: 2px;
            word-break: break-all;
        }

        /* Tabs (matches main page Instance tab style) */
        #tabs {
            display: flex; flex-shrink: 0; gap: 4px;
            background: var(--tab-bg);
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
        }
        #tabs button {
            padding: 6px 12px; border: 1px solid transparent;
            border-bottom: none; border-radius: 4px 4px 0 0;
            background: none; font-size: 13px; cursor: pointer;
            color: var(--text-secondary); user-select: none;
            margin-bottom: -1px;
        }
        #tabs button:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }
        #tabs button.active {
            background: var(--main-bg);
            border-color: var(--border-color);
            color: var(--text-primary); font-weight: 500;
            border-top: 2px solid var(--active-color);
        }

        /* Content */
        #content {
            flex: 1; overflow: auto; padding: 0;
        }
        #content pre {
            margin: 0 auto; padding: 16px; max-width: 1100px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; line-height: 1.5;
            white-space: pre; overflow-x: auto;
        }
        #content .empty-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); font-size: 13px;
        }
        #content .error-state {
            background: var(--error-bg); color: var(--error-text);
            padding: 16px; margin: 16px auto; max-width: 700px; border-radius: 6px;
            font-size: 12px;
        }
        #content .loading-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--loading-text); font-size: 13px;
        }

        /* Markdown rendered content */
        #content .markdown-body {
            margin: 0 auto; padding: 16px; max-width: 900px;
            font-size: 14px; line-height: 1.6; color: var(--text-primary);
        }
        #content .markdown-body h1, #content .markdown-body h2, #content .markdown-body h3 {
            margin-top: 16px; margin-bottom: 8px; font-weight: 600;
        }
        #content .markdown-body h1 { font-size: 1.5em; }
        #content .markdown-body h2 { font-size: 1.3em; }
        #content .markdown-body h3 { font-size: 1.1em; }
        #content .markdown-body p { margin-bottom: 8px; }
        #content .markdown-body pre {
            background: var(--code-bg); border-radius: 6px;
            padding: 12px; overflow-x: auto;
        }
        #content .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9em;
        }
        #content .markdown-body :not(pre) > code {
            background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
        }
        #content .markdown-body a { color: #0969da; }
        #content .markdown-body table { border-collapse: collapse; width: 100%; }
        #content .markdown-body th, #content .markdown-body td {
            border: 1px solid var(--border-color); padding: 6px 12px; text-align: left;
        }
        #content .markdown-body th { background: var(--code-bg); }
        #content .markdown-body blockquote {
            border-left: 3px solid var(--border-color); padding-left: 12px;
            color: var(--text-muted); margin: 8px 0;
        }

        /* Code + line numbers */
        .code-lines {
            max-width: 1100px; margin: 0 auto;
            border: 1px solid var(--border-color); border-radius: 6px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; line-height: 1.5;
        }
        .code-line { display: flex; white-space: pre; min-width: max-content; }
        .code-line .ln {
            padding: 0 10px; text-align: right; color: var(--text-muted);
            user-select: none; min-width: 3.5em; flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            background: var(--header-bg);
        }
        .code-line .cd { padding: 0 16px; }

        /* Diff row background (text color handled by highlight.js) */
        .code-line.diff-add { background: var(--diff-add-bg); }
        .code-line.diff-del { background: var(--diff-del-bg); }
        .code-line.diff-hunk { background: none; }

        /* Adaptive source-render feedback and hard-limit fallback */
        .preview-render-status {
            position: sticky; top: 0; z-index: 2;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 16px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 11px;
        }
        .preview-render-status .grow {
            flex: 1; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .preview-render-status button {
            flex-shrink: 0;
            min-height: 30px; padding: 3px 10px;
            border: 1px solid var(--border-color); border-radius: 4px;
            background: var(--main-bg); color: var(--text-primary);
            font: inherit; cursor: pointer;
        }
        .preview-render-status button:hover { background: var(--hover-bg); }
        .preview-limit {
            margin: 16px auto; max-width: 700px; padding: 16px;
            border: 1px solid var(--border-color); border-radius: 6px;
            background: var(--header-bg); color: var(--text-primary);
            font-size: 12px; line-height: 1.6;
            word-break: break-word;
        }
        .preview-limit h2 { margin: 0 0 8px; font-size: 14px; }
        .preview-limit p { margin: 0 0 8px; }
        .preview-limit .metrics {
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
        }
        .preview-limit button {
            min-height: 32px; margin-top: 4px; padding: 4px 12px;
            border: 1px solid var(--border-color); border-radius: 4px;
            background: var(--main-bg); color: var(--text-primary);
            font: inherit; cursor: pointer;
        }
        .preview-limit button:hover { background: var(--hover-bg); }
        .preview-note {
            margin: 16px auto 0; max-width: 1100px; padding: 10px 16px;
            border-left: 3px solid var(--active-color);
            background: var(--header-bg); color: var(--text-secondary);
            font-size: 12px; line-height: 1.5;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="header"></div>
    <div id="tabs">
        <button id="tab-diff" class="active">Diff Preview</button>
        <button id="tab-formatted">Formatted Preview</button>
    </div>
    <div id="content">
        <div class="loading-state">Loading...</div>
    </div>
</div>

<!-- highlight.js and marked.js — local vendor only -->
<link rel="stylesheet" href="/static/vendor/highlight/github.min.css" id="hljs-light-theme">
<link rel="stylesheet" href="/static/vendor/highlight/github-dark.min.css" id="hljs-dark-theme" disabled>
<script src="/static/vendor/highlight/highlight.min.js"></script>
<script src="/static/vendor/marked/marked.min.js"></script>

<script>
(function() {
    // Parse URL params
    var params = new URLSearchParams(window.location.search);
    var worktreeId = params.get('id') || '';
    var filePath = params.get('path') || '';
    var repo = params.get('repo') || '';
    var wtName = params.get('wt_name') || '';
    var branch = params.get('branch') || '';
    var fileName = params.get('file') || filePath.split('/').pop() || '';
    var staged = params.get('staged') === 'true';
    var fullPath = params.get('full_path') || '';
    var activeTab = params.get('tab') || 'diff';

    // Vendor library availability
    var hljsOk = typeof hljs !== 'undefined';
    var markedOk = typeof marked !== 'undefined';

    // Cache for tab content
    var cachedDiff = null;
    var cachedContent = null;
    var cachedContentBytes = 0;
    var contentFileType = 'text/plain';
    var activeLoadSeq = 0;
    var activeFormattedJob = null;
    var activeCodeHighlightObserver = null;

    // Front-end safety envelope. The backend 1 MiB cap is far above the
    // synchronous render cost measured for issue #144, so Formatted Preview
    // applies its own, lower limits before touching DOM or highlight.js.
    var RENDER_LIMITS = {
        // Match the backend's hard 1 MiB text cap. Parsing is off-main-thread
        // (Worker) and source rendering is chunked/interruptible, so this is
        // the supported ceiling, not a synchronous-render budget.
        maxBytes: 1024 * 1024,
        maxLines: 20000,
        maxLineChars: 32 * 1024,
        excerptLines: 200,
        excerptBytes: 64 * 1024,
        initialChunkSize: 80,
        minChunkSize: 20,
        maxChunkSize: 400,
        targetChunkMs: 16,
        maxTotalRenderMs: 10000
    };

    // Set page title
    document.title = (fileName || 'File Preview') + ' - myworktree';

    // Render header
    function renderHeader() {
        var h = document.getElementById('header');
        var parts = [];
        if (repo) parts.push('<span>\uD83D\uDCC2 ' + esc(repo) + '</span>');
        if (wtName) parts.push('<span class="sep">/</span> <span>' + esc(wtName) + '</span>');
        if (branch) parts.push('<span class="sep">\u00B7</span> <span class="branch">' + esc(branch) + '</span>');
        if (fileName) parts.push('<span class="sep">\u00B7</span> <span>' + esc(fileName) + '</span>');
        h.innerHTML = '<div class="header-line1">' + (parts.join('') || 'File Preview') + '</div>' +
            '<div class="header-line2">' + esc(fullPath || filePath) + '</div>';
    }

    // Tab switching
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('#tabs button').forEach(function(b) { b.classList.remove('active'); });
        document.getElementById('tab-' + tab).classList.add('active');
        loadTab(tab);
    }

    // Fetch API with auth (same pattern as index.html)
    function apiFetch(url) {
        return fetch(url, { credentials: 'include' });
    }

    function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // Map file extension to highlight.js language
    function extToLang(ext) {
        var m = { '.go': 'go', '.js': 'javascript', '.ts': 'typescript', '.tsx': 'typescript',
            '.jsx': 'javascript', '.py': 'python',
            '.rs': 'rust', '.java': 'java', '.json': 'json', '.yaml': 'yaml', '.yml': 'yaml',
            '.toml': 'ini', '.sh': 'bash', '.bash': 'bash', '.zsh': 'bash',
            '.html': 'xml', '.css': 'css', '.scss': 'css', '.less': 'css',
            '.c': 'c', '.cpp': 'cpp', '.h': 'c', '.hpp': 'cpp',
            '.vue': 'xml', '.svelte': 'xml', '.xml': 'xml', '.svg': 'xml', '.sql': 'sql',
            '.md': 'markdown', '.markdown': 'markdown' };
        return m[ext] || '';
    }

    // Formatting/measurement helpers are deliberately independent of the DOM
    // so the preflight contract can be exercised under node --test.
    function formatPreviewBytes(bytes) {
        if (!isFinite(bytes) || bytes < 0) return 'unknown';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (Math.round(bytes / 102.4) / 10) + ' KB';
        return (Math.round(bytes / (1024 * 1024) * 10) / 10) + ' MB';
    }

    function formatPreviewCount(n) {
        return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function measurePreviewContent(text) {
        var lines = text.split('\n');
        if (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
        var longestLine = 0;
        for (var i = 0; i < lines.length; i++) {
            if (lines[i].length > longestLine) longestLine = lines[i].length;
        }
        return {
            lines: lines,
            lineCount: lines.length,
            longestLine: longestLine,
            charCount: text.length
        };
    }

    function previewLimitReasons(info, bytes, limits) {
        var reasons = [];
        if (bytes > limits.maxBytes) reasons.push('size');
        if (info.lineCount > limits.maxLines) reasons.push('lines');
        if (info.longestLine > limits.maxLineChars) reasons.push('line-length');
        return reasons;
    }

    function adaptPreviewChunkSize(current, workMs, frameMs, limits) {
        // frameMs includes the browser's normal ~16 ms frame cadence; only the
        // excess over 24 ms is treated as layout pressure.
        var framePressure = Math.max(0, frameMs - 24);
        var pressure = Math.max(workMs, framePressure);
        if (pressure > limits.targetChunkMs) {
            return Math.max(limits.minChunkSize, Math.floor(current / 2));
        }
        if (pressure < limits.targetChunkMs / 2) {
            return Math.min(limits.maxChunkSize, current * 2);
        }
        return current;
    }

    function buildPreviewExcerpt(lines, limits) {
        var out = [];
        var totalChars = 0;
        var lineTruncated = false;
        for (var i = 0; i < lines.length && out.length < limits.excerptLines; i++) {
            var line = String(lines[i]);
            if (line.length > limits.maxLineChars) {
                line = line.slice(0, limits.maxLineChars) + '\u2026';
                lineTruncated = true;
            }
            var add = line.length + (out.length > 0 ? 1 : 0);
            if (totalChars + add > limits.excerptBytes) break;
            out.push(line);
            totalChars += add;
        }
        return {
            text: out.join('\n'),
            lines: out,
            lineCount: out.length,
            omittedLines: Math.max(0, lines.length - out.length),
            charCount: totalChars,
            lineTruncated: lineTruncated
        };
    }

    function clearCodeHighlightObserver() {
        if (activeCodeHighlightObserver) {
            activeCodeHighlightObserver.disconnect();
            activeCodeHighlightObserver = null;
        }
    }

    // Borrowed from dsh-web's viewport highlighting: Markdown can contain many
    // code fences, and highlighting every fence up front can itself become a
    // main-thread task. Highlight only as each fence approaches the viewport.
    function observeMarkdownCodeBlocks(container) {
        clearCodeHighlightObserver();
        if (!hljsOk || !container) return;
        var blocks = Array.prototype.slice.call(container.querySelectorAll('pre code'));
        if (blocks.length === 0) return;
        function highlight(block) {
            try { hljs.highlightElement(block); } catch (err) {}
        }
        if (typeof IntersectionObserver === 'undefined') {
            blocks.forEach(highlight);
            return;
        }
        var root = document.getElementById('content');
        activeCodeHighlightObserver = new IntersectionObserver(function(entries) {
            for (var i = 0; i < entries.length; i++) {
                if (!entries[i].isIntersecting) continue;
                activeCodeHighlightObserver.unobserve(entries[i].target);
                highlight(entries[i].target);
            }
        }, { root: root, rootMargin: '200px 0px' });
        blocks.forEach(function(block) { activeCodeHighlightObserver.observe(block); });
    }

    // Theme switching for highlight.js
    function updateHLJSTheme() {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.getElementById('hljs-light-theme').disabled = dark;
        document.getElementById('hljs-dark-theme').disabled = !dark;
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateHLJSTheme);
    updateHLJSTheme();

    // Load tab content
    function loadTab(tab) {
        var content = document.getElementById('content');
        var loadSeq = ++activeLoadSeq;
        // Any tab change supersedes an in-flight adaptive render. Its loop
        // checks job.cancelled after every yield and stops before the next
        // chunk, so a late response cannot append into the new tab.
        cancelActiveFormattedRender('tab');

        if (tab === 'diff') {
            if (cachedDiff !== null) { showDiff(cachedDiff); return; }
            content.innerHTML = '<div class="loading-state">Loading diff...</div>';
            content.setAttribute('data-render-state', 'loading');
            var url = '/api/worktree/file/diff?id=' + encodeURIComponent(worktreeId) +
                '&path=' + encodeURIComponent(filePath) +
                '&staged=' + staged;
            apiFetch(url).then(function(resp) {
                if (!resp.ok) return resp.text().then(function(t) { throw new Error(t || resp.statusText); });
                return resp.text();
            }).then(function(text) {
                cachedDiff = text;
                if (loadSeq !== activeLoadSeq || activeTab !== 'diff') return;
                showDiff(text);
            }).catch(function(err) {
                if (loadSeq !== activeLoadSeq || activeTab !== 'diff') return;
                content.innerHTML = '<div class="error-state">' + esc('Failed to load diff: ' + err.message) + '</div>';
                content.setAttribute('data-render-state', 'error');
            });
            return;
        }

        if (cachedContent !== null) {
            if (loadSeq === activeLoadSeq && activeTab === 'formatted') {
                showFormatted(cachedContent, contentFileType, cachedContentBytes);
            }
            return;
        }
        content.innerHTML = '<div class="loading-state">Loading content...</div>';
        content.setAttribute('data-render-state', 'loading');
        var url = '/api/worktree/file/content?id=' + encodeURIComponent(worktreeId) +
            '&path=' + encodeURIComponent(filePath);
        apiFetch(url).then(function(resp) {
            if (!resp.ok) return resp.text().then(function(t) {
                var loadErr = new Error(t || resp.statusText);
                loadErr.status = resp.status;
                loadErr.fileType = resp.headers.get('X-File-Type') || '';
                var respSize = parseInt(resp.headers.get('X-File-Size') || '', 10);
                if (isFinite(respSize) && respSize >= 0) loadErr.fileSize = respSize;
                throw loadErr;
            });
            var ft = resp.headers.get('X-File-Type') || 'text/plain';
            var sizeHeader = parseInt(resp.headers.get('X-File-Size') || '', 10);
            var size = isFinite(sizeHeader) && sizeHeader >= 0 ? sizeHeader : 0;
            if (!fullPath) {
                var fp = resp.headers.get('X-File-FullPath');
                if (fp) { fullPath = fp; renderHeader(); }
            }
            return resp.text().then(function(t) {
                return { text: t, fileType: ft, bytes: size || t.length };
            });
        }).then(function(data) {
            cachedContent = data.text;
            contentFileType = data.fileType;
            cachedContentBytes = data.bytes;
            if (loadSeq !== activeLoadSeq || activeTab !== 'formatted') return;
            showFormatted(data.text, data.fileType, data.bytes);
        }).catch(function(err) {
            if (loadSeq !== activeLoadSeq || activeTab !== 'formatted') return;
            showContentLoadError(err);
        });
    }

    function splitHighlightedLines(text, lang) {
        var result = hljs.highlight(text, {language: lang});
        var htmlLines = result.value.split('\n');
        var out = [];
        // Stack of unclosed <span ...> tags — survives across lines so
        // multi-line tokens (block comments, docstrings, raw strings) keep
        // their colour on continuation lines.
        var stack = [];

        for (var i = 0; i < htmlLines.length; i++) {
            var line = htmlLines[i];

            // Reopen spans from previous line (reverse = correct nesting).
            for (var k = stack.length - 1; k >= 0; k--) {
                line = stack[k] + line;
            }

            // Walk all <span…> and </span> in this line.
            var re = /<span[^>]*>|<\/span>/g;
            var m;
            while ((m = re.exec(line)) !== null) {
                if (m[0].indexOf('</span>') === 0) {
                    if (stack.length > 0) stack.pop();
                } else {
                    stack.push(m[0]);
                }
            }

            // Close any spans that remain open at end of line (stack survives
            // for the next line so they can be reopened above).
            for (var j = 0; j < stack.length; j++) {
                line += '</span>';
            }

            out.push(line);
        }
        // If hljs output ends with unclosed <span>s (malformed input edge
        // case), close them on the last line so browsers don't auto-close
        // beyond our container and affect subsequent page style scope.
        if (out.length > 0 && stack.length > 0) {
            for (var j = 0; j < stack.length; j++) {
                out[out.length - 1] += '</span>';
            }
        }
        return out;
    }

    function appendPreviewCodeRows(container, lines, hlLines, start, count) {
        var frag = document.createDocumentFragment();
        var end = Math.min(lines.length, start + count);
        for (var i = start; i < end; i++) {
            var row = document.createElement('div');
            row.className = 'code-line';

            var ln = document.createElement('span');
            ln.className = 'ln';
            ln.textContent = (i + 1);

            var cd = document.createElement('span');
            cd.className = 'cd';
            if (hlLines) {
                cd.innerHTML = hlLines[i] !== undefined ? hlLines[i] : esc(lines[i]);
            } else {
                cd.textContent = lines[i];
            }

            row.appendChild(ln);
            row.appendChild(cd);
            frag.appendChild(row);
        }
        container.appendChild(frag);
    }

    function cancelActiveFormattedRender(reason) {
        var job = activeFormattedJob;
        if (!job || job.cancelled) return;
        job.cancelled = true;
        activeFormattedJob = null;
        clearCodeHighlightObserver();
        if (job.worker) {
            try { job.worker.terminate(); } catch (err) {}
            job.worker = null;
        }
        if (job.wakeYield) job.wakeYield();
        if (reason !== 'user') return;

        var content = document.getElementById('content');
        if (content) content.setAttribute('data-render-state', 'stopped');
        if (job.loadingEl && job.loadingEl.parentNode) job.loadingEl.parentNode.removeChild(job.loadingEl);
        if (job.label) {
            if (job.kind === 'markdown') {
                job.label.textContent = 'Markdown rendering stopped.';
            } else {
                job.label.textContent = 'Rendering stopped. Showing ' +
                    formatPreviewCount(job.rendered) + ' of ' +
                    formatPreviewCount(job.totalLines) + ' lines.';
            }
        }
        if (job.stopBtn && job.stopBtn.parentNode) job.stopBtn.parentNode.removeChild(job.stopBtn);
    }

    // Resolve after the browser has had a chance to paint and process input.
    // The 250 ms safety timer is a hidden-tab fallback: Safari/Chrome may stop
    // requestAnimationFrame callbacks while the page is backgrounded.
    function yieldToPreviewFrame(job) {
        return new Promise(function(resolve) {
            var settled = false;
            var safety = setTimeout(finish, 250);
            function finish() {
                if (settled) return;
                settled = true;
                clearTimeout(safety);
                if (job) job.wakeYield = null;
                resolve();
            }
            if (job) job.wakeYield = finish;
            if (job && job.cancelled) { finish(); return; }
            if (typeof requestAnimationFrame === 'function' && !document.hidden) {
                requestAnimationFrame(function() { setTimeout(finish, 0); });
            } else {
                setTimeout(finish, 0);
            }
        });
    }

    function finishPreviewRender(job) {
        if (job.cancelled) return;
        activeFormattedJob = null;
        if (job.statusEl && job.statusEl.parentNode) job.statusEl.parentNode.removeChild(job.statusEl);
        var content = document.getElementById('content');
        if (content) content.setAttribute('data-render-state', job.excerpt ? 'excerpt' : 'complete');
    }

    function finishTruncatedPreviewRender(job, reason) {
        if (job.cancelled) return;
        job.cancelled = true;
        activeFormattedJob = null;
        var content = document.getElementById('content');
        if (content) content.setAttribute('data-render-state', reason === 'error' ? 'error' : 'truncated');
        if (job.stopBtn && job.stopBtn.parentNode) job.stopBtn.parentNode.removeChild(job.stopBtn);
        if (reason === 'error') {
            job.label.textContent = 'Preview rendering failed: ' + (job.renderError || 'unknown error');
            return;
        }
        job.label.textContent = 'Rendering stopped after ' +
            formatPreviewCount(job.rendered) + ' of ' +
            formatPreviewCount(job.totalLines) + ' lines to keep the page responsive (' +
            formatPreviewCount(RENDER_LIMITS.maxTotalRenderMs) + ' ms budget).';
    }

    function startPreviewSourceRender(text, fileType, context) {
        cancelActiveFormattedRender('replace');
        var content = document.getElementById('content');
        var job = {
            kind: 'source',
            cancelled: false,
            excerpt: !!(context && context.excerpt),
            rendered: 0,
            totalLines: 0,
            startedAt: 0,
            wakeYield: null,
            statusEl: null,
            label: null,
            stopBtn: null,
            renderError: ''
        };
        var lines = context && context.lines ? context.lines : text.split('\n');
        if (lines.length > 0 && lines[lines.length - 1] === '') lines = lines.slice(0, -1);
        job.totalLines = lines.length;
        job.startedAt = performance.now();
        activeFormattedJob = job;

        content.innerHTML = '';
        content.setAttribute('data-render-state', 'running');

        var status = document.createElement('div');
        status.className = 'preview-render-status';
        status.setAttribute('role', 'status');
        var label = document.createElement('span');
        label.className = 'grow';
        label.textContent = 'Preparing preview…';
        var stopBtn = document.createElement('button');
        stopBtn.type = 'button';
        stopBtn.textContent = 'Stop';
        stopBtn.addEventListener('click', function() { cancelActiveFormattedRender('user'); });
        status.appendChild(label);
        status.appendChild(stopBtn);
        content.appendChild(status);
        job.statusEl = status;
        job.label = label;
        job.stopBtn = stopBtn;

        if (context && (job.excerpt || context.notice)) {
            var note = document.createElement('div');
            note.className = 'preview-note';
            if (context.notice) {
                note.textContent = context.notice;
            } else {
                var noteText = 'Showing a bounded excerpt: ' +
                    formatPreviewCount(context.excerptLineCount || 0) + ' of ' +
                    formatPreviewCount(context.sourceLineCount || 0) + ' lines';
                if (context.omittedLines) noteText += '; ' + formatPreviewCount(context.omittedLines) + ' omitted';
                if (context.lineTruncated) noteText += '; lines longer than ' + formatPreviewCount(RENDER_LIMITS.maxLineChars) + ' characters were shortened';
                noteText += '. Full file: ' + formatPreviewBytes(context.sourceBytes) + '. Diff Preview and your editor still have the complete content.';
                note.textContent = noteText;
            }
            content.appendChild(note);
        }

        var container = document.createElement('div');
        container.className = 'code-lines';
        content.appendChild(container);

        async function run() {
            // Let the preparing status paint before the bounded, synchronous
            // highlight step starts.
            await new Promise(function(resolve) { setTimeout(resolve, 0); });
            if (job.cancelled) return;

            var lang = '';
            if (fileType === 'text/x-code') {
                var ext = filePath.substring(filePath.lastIndexOf('.')).toLowerCase();
                lang = extToLang(ext);
            }

            var hlLines = null;
            if (hljsOk && lang) {
                try {
                    hlLines = splitHighlightedLines(text, lang);
                } catch (err) {
                    hlLines = null;
                }
            }
            if (job.cancelled) return;
            if (hlLines) {
                while (hlLines.length < lines.length) hlLines.push('');
                if (hlLines.length > lines.length) hlLines = hlLines.slice(0, lines.length);
            }
            if (lines.length === 0) {
                finishPreviewRender(job);
                return;
            }

            job.label.textContent = 'Rendering 0 / ' + formatPreviewCount(lines.length) + ' lines…';
            var chunkSize = Math.max(1, Math.min(RENDER_LIMITS.initialChunkSize, lines.length));
            while (job.rendered < lines.length) {
                if (job.cancelled) return;
                var chunkStart = performance.now();
                var count = Math.min(chunkSize, lines.length - job.rendered);
                appendPreviewCodeRows(container, lines, hlLines, job.rendered, count);
                var workMs = performance.now() - chunkStart;
                job.rendered += count;
                job.label.textContent = 'Rendering ' + formatPreviewCount(job.rendered) +
                    ' / ' + formatPreviewCount(lines.length) + ' lines…';

                if (job.rendered >= lines.length) {
                    finishPreviewRender(job);
                    return;
                }

                var frameStart = performance.now();
                await yieldToPreviewFrame(job);
                var frameMs = performance.now() - frameStart;
                if (job.cancelled) return;
                if (performance.now() - job.startedAt > RENDER_LIMITS.maxTotalRenderMs) {
                    finishTruncatedPreviewRender(job, 'timeout');
                    return;
                }
                chunkSize = adaptPreviewChunkSize(chunkSize, workMs, frameMs, RENDER_LIMITS);
            }
        }

        run().catch(function(err) {
            job.renderError = err && err.message ? err.message : String(err);
            finishTruncatedPreviewRender(job, 'error');
        });
    }

    function startPreviewMarkdownRender(text, metrics) {
        cancelActiveFormattedRender('replace');
        var content = document.getElementById('content');
        var job = {
            kind: 'markdown',
            cancelled: false,
            worker: null,
            statusEl: null,
            label: null,
            stopBtn: null,
            loadingEl: null,
            rendered: 0,
            totalLines: metrics.lineCount,
            excerpt: false,
            wakeYield: null
        };
        activeFormattedJob = job;

        content.innerHTML = '';
        content.setAttribute('data-render-state', 'parsing');

        var status = document.createElement('div');
        status.className = 'preview-render-status';
        status.setAttribute('role', 'status');
        var label = document.createElement('span');
        label.className = 'grow';
        label.textContent = 'Parsing Markdown in background…';
        var stopBtn = document.createElement('button');
        stopBtn.type = 'button';
        stopBtn.textContent = 'Stop';
        stopBtn.addEventListener('click', function() { cancelActiveFormattedRender('user'); });
        status.appendChild(label);
        status.appendChild(stopBtn);
        content.appendChild(status);
        job.statusEl = status;
        job.label = label;
        job.stopBtn = stopBtn;

        var loading = document.createElement('div');
        loading.className = 'loading-state';
        loading.textContent = 'Parsing Markdown…';
        content.appendChild(loading);
        job.loadingEl = loading;

        function cleanupMarkdownWorker() {
            job.cancelled = true;
            activeFormattedJob = null;
            if (job.worker) {
                try { job.worker.terminate(); } catch (err) {}
                job.worker = null;
            }
        }

        function fallbackToSource(reason) {
            if (job.cancelled) return;
            cleanupMarkdownWorker();
            job.cancelled = true;
            startPreviewSourceRender(text, 'text/plain', {
                lines: metrics.lines,
                notice: 'Background Markdown parsing failed; showing raw Markdown source instead. ' +
                    (reason ? '(' + reason + ')' : '')
            });
        }

        function finishMarkdown(html) {
            if (job.cancelled) return;
            try {
                content.innerHTML = '<div class="markdown-body">' + html + '</div>';
                // Keep the same code-block highlighting contract as the old
                // synchronous Markdown path. This runs after the worker result,
                // so the parser itself is no longer on the main thread.
                observeMarkdownCodeBlocks(content);
                content.setAttribute('data-render-state', 'complete');
                cleanupMarkdownWorker();
            } catch (err) {
                fallbackToSource(err && err.message ? err.message : String(err));
            }
        }

        var worker;
        try {
            worker = new Worker('/static/preview_markdown_worker.js');
        } catch (err) {
            fallbackToSource(err && err.message ? err.message : String(err));
            return;
        }
        job.worker = worker;

        worker.onmessage = function(event) {
            if (job.cancelled) return;
            var data = event.data || {};
            if (data.type === 'error') {
                fallbackToSource(data.message || 'Markdown parser error');
                return;
            }
            if (data.type !== 'result') return;
            finishMarkdown(data.html || '');
        };
        worker.onerror = function(event) {
            if (job.cancelled) return;
            fallbackToSource(event && event.message ? event.message : 'Markdown worker error');
        };

        try {
            worker.postMessage({ type: 'parse', id: 1, text: text });
        } catch (err) {
            fallbackToSource(err && err.message ? err.message : String(err));
        }
    }

    function showPreviewLimit(text, fileType, bytes, metrics, reasons) {
        cancelActiveFormattedRender('limit');
        var content = document.getElementById('content');
        content.innerHTML = '';
        content.setAttribute('data-render-state', 'limit');

        var card = document.createElement('div');
        card.className = 'preview-limit';
        card.setAttribute('role', 'status');

        var title = document.createElement('h2');
        title.textContent = 'Preview limited';
        card.appendChild(title);

        var actual = document.createElement('p');
        actual.textContent = 'This file is ' + formatPreviewBytes(bytes) +
            ' with ' + formatPreviewCount(metrics.lineCount) + ' lines; the longest line is ' +
            formatPreviewCount(metrics.longestLine) + ' characters.';
        card.appendChild(actual);

        var threshold = document.createElement('p');
        threshold.textContent = 'Safe source-preview limits: ' + formatPreviewBytes(RENDER_LIMITS.maxBytes) +
            ', ' + formatPreviewCount(RENDER_LIMITS.maxLines) + ' lines, and ' +
            formatPreviewCount(RENDER_LIMITS.maxLineChars) + ' characters per line.';
        card.appendChild(threshold);

        var reasonText = document.createElement('p');
        var exceeded = [];
        if (reasons.indexOf('size') >= 0) exceeded.push('file size');
        if (reasons.indexOf('lines') >= 0) exceeded.push('line count');
        if (reasons.indexOf('line-length') >= 0) exceeded.push('longest line');
        reasonText.textContent = 'The ' + exceeded.join(' and ') +
            ' exceeded the safe limit, so the full source was not rendered synchronously. ' +
            'Diff Preview and your editor still have the complete content.';
        card.appendChild(reasonText);

        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Show safe excerpt (first ' +
            formatPreviewCount(Math.min(RENDER_LIMITS.excerptLines, metrics.lineCount)) + ' lines)';
        button.addEventListener('click', function() {
            var excerpt = buildPreviewExcerpt(metrics.lines, RENDER_LIMITS);
            if (excerpt.lineCount === 0) {
                button.disabled = true;
                button.textContent = 'No safe excerpt available';
                return;
            }
            startPreviewSourceRender(excerpt.text, fileType, {
                lines: excerpt.lines,
                excerpt: true,
                sourceBytes: bytes,
                sourceLineCount: metrics.lineCount,
                excerptLineCount: excerpt.lineCount,
                omittedLines: excerpt.omittedLines,
                lineTruncated: excerpt.lineTruncated
            });
        });
        card.appendChild(button);
        content.appendChild(card);
    }

    function showContentLoadError(err) {
        cancelActiveFormattedRender('error');
        var content = document.getElementById('content');
        content.innerHTML = '';
        var status = err && err.status;
        var titleText = 'Preview unavailable';
        var state = 'error';
        var reason = err && err.message ? err.message : 'Unknown load error';
        var next = 'Use Diff Preview or open the file in an editor for the complete content.';
        if (status === 415) {
            titleText = 'Preview not supported';
            state = 'unsupported';
            reason = 'This file type has no registered safe preview renderer, so its content was not parsed.';
            next = 'The file was blocked instead of being guessed or rendered as plain text.';
        } else if (status === 413) {
            titleText = 'Preview limited';
            state = 'limit';
            next = 'The file was not parsed. Use Diff Preview or open the file in an editor for the complete content.';
        } else if (status === 403) {
            titleText = 'Preview blocked';
            state = 'unsupported';
            next = 'This path is outside the preview safety policy.';
        }

        var card = document.createElement('div');
        card.className = 'preview-limit';
        card.setAttribute('role', 'alert');
        var title = document.createElement('h2');
        title.textContent = titleText;
        card.appendChild(title);

        if (err && isFinite(err.fileSize) && err.fileSize >= 0) {
            var actual = document.createElement('p');
            actual.textContent = 'File size: ' + formatPreviewBytes(err.fileSize) + '.';
            card.appendChild(actual);
        }
        var reasonEl = document.createElement('p');
        reasonEl.textContent = reason;
        card.appendChild(reasonEl);
        var nextEl = document.createElement('p');
        nextEl.textContent = next;
        card.appendChild(nextEl);
        content.appendChild(card);
        content.setAttribute('data-render-state', state);
    }

    function renderDiffWithLineNumbers(text) {
        var lines = text.split('\n');
        if (lines.length > 0 && lines[lines.length - 1] === '') lines = lines.slice(0, -1);

        // Pre-compute highlighted lines via splitHighlightedLines. Diff tokens
        // are always intra-line (every line starts with +, -, or @), so the
        // stack mechanism is a no-op — the consistency is worth the call site.
        var hlLines = null;
        if (hljsOk) {
            hlLines = splitHighlightedLines(text, 'diff');
            while (hlLines.length < lines.length) hlLines.push('');
            if (hlLines.length > lines.length) hlLines = hlLines.slice(0, lines.length);
        }

        var currentNew = 0;
        var hunkRe = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/;

        var container = document.createElement('div');
        container.className = 'code-lines';

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var row = document.createElement('div');
            row.className = 'code-line';

            var ln = document.createElement('span');
            ln.className = 'ln';

            if (line.indexOf('@@') === 0) {
                var m = line.match(hunkRe);
                if (m) currentNew = parseInt(m[1], 10) - 1;
                ln.textContent = '\u00B7\u00B7\u00B7';
                row.classList.add('diff-hunk');
            } else if (line.charAt(0) === '+') {
                currentNew++;
                ln.textContent = currentNew;
                row.classList.add('diff-add');
            } else if (line.charAt(0) === '-') {
                ln.textContent = '';
                row.classList.add('diff-del');
            } else {
                currentNew++;
                ln.textContent = currentNew;
            }

            var cd = document.createElement('span');
            cd.className = 'cd';
            if (hlLines) {
                cd.innerHTML = hlLines[i] || esc(line);
            } else {
                cd.textContent = line;
            }

            row.appendChild(ln);
            row.appendChild(cd);
            container.appendChild(row);
        }
        return container;
    }

    function showDiff(text) {
        var content = document.getElementById('content');
        if (!text || text.trim() === '') {
            content.innerHTML = '<div class="empty-state">No changes</div>';
            content.setAttribute('data-render-state', 'empty');
            return;
        }
        content.innerHTML = '';
        content.appendChild(renderDiffWithLineNumbers(text));
        content.setAttribute('data-render-state', 'complete');
    }

    function showFormatted(text, fileType, bytes) {
        cancelActiveFormattedRender('replace');
        var content = document.getElementById('content');
        if (!text || text.trim() === '') {
            content.innerHTML = '<div class="empty-state">Empty file</div>';
            content.setAttribute('data-render-state', 'empty');
            return;
        }

        var sourceBytes = isFinite(bytes) && bytes > 0 ? bytes : text.length;
        var metrics = measurePreviewContent(text);
        var reasons = previewLimitReasons(metrics, sourceBytes, RENDER_LIMITS);
        if (reasons.length > 0) {
            showPreviewLimit(text, fileType, sourceBytes, metrics, reasons);
            return;
        }

        if (fileType === 'text/markdown' && markedOk) {
            startPreviewMarkdownRender(text, metrics);
            return;
        }

        startPreviewSourceRender(text, fileType, { lines: metrics.lines });
    }

    // Tab click handlers
    document.getElementById('tab-diff').addEventListener('click', function() { switchTab('diff'); });
    document.getElementById('tab-formatted').addEventListener('click', function() { switchTab('formatted'); });

    // Init
    renderHeader();
    if (activeTab === 'formatted') {
        document.getElementById('tab-diff').classList.remove('active');
        document.getElementById('tab-formatted').classList.add('active');
    }
    loadTab(activeTab);
})();
</script>
