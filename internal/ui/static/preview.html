<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="page-title">File Preview - myworktree</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #e1e4e8;
            --text-primary: #24292e;
            --text-secondary: #586069;
            --text-muted: #6a737d;
            --header-bg: #f6f8fa;
            --tab-active-bg: #ffffff;
            --tab-bg: #f6f8fa;
            --tab-border: #e1e4e8;
            --hover-bg: #f6f8fa;
            --content-bg: #ffffff;
            --diff-add-bg: #e6ffec;
            --diff-add-text: #1a7f37;
            --diff-del-bg: #ffebe9;
            --diff-del-text: #cf222e;
            --diff-hunk: #0969da;
            --diff-header: #656d76;
            --code-bg: #f6f8fa;
            --error-bg: #ffebe9;
            --error-text: #cf222e;
            --loading-text: #656d76;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --border-color: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --text-muted: #6e7681;
                --header-bg: #161b22;
                --tab-active-bg: #0d1117;
                --tab-bg: #161b22;
                --tab-border: #30363d;
                --hover-bg: #161b22;
                --content-bg: #0d1117;
                --diff-add-bg: #1a3a2a;
                --diff-add-text: #3fb950;
                --diff-del-bg: #3a1a1a;
                --diff-del-text: #f85149;
                --diff-hunk: #58a6ff;
                --diff-header: #8b949e;
                --code-bg: #161b22;
                --error-bg: #3a1a1a;
                --error-text: #f85149;
                --loading-text: #8b949e;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px; color: var(--text-primary); background: var(--bg-color);
        }
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        #header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px;
            flex-shrink: 0;
        }
        #header .header-line1 {
            font-size: 13px; font-weight: 500; color: var(--text-primary);
            display: flex; align-items: center; gap: 6px;
        }
        #header .header-line1 .sep { color: var(--text-muted); }
        #header .header-line1 .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
        #header .header-line2 {
            font-size: 11px; color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            margin-top: 2px;
            word-break: break-all;
        }

        /* Tabs */
        #tabs {
            display: flex; flex-shrink: 0;
            border-bottom: 1px solid var(--tab-border);
            background: var(--header-bg);
            padding: 0 16px;
        }
        #tabs button {
            padding: 8px 16px; border: none; background: none;
            font-size: 13px; cursor: pointer; color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        #tabs button:hover { color: var(--text-primary); }
        #tabs button.active {
            color: var(--text-primary); font-weight: 500;
            border-bottom-color: #0969da;
        }

        /* Content */
        #content {
            flex: 1; overflow: auto; padding: 0;
        }
        #content pre {
            margin: 0; padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; line-height: 1.5;
            white-space: pre; overflow-x: auto;
        }
        #content .empty-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); font-size: 13px;
        }
        #content .error-state {
            background: var(--error-bg); color: var(--error-text);
            padding: 16px; margin: 16px; border-radius: 6px;
            font-size: 12px;
        }
        #content .loading-state {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--loading-text); font-size: 13px;
        }

        /* Markdown rendered content */
        #content .markdown-body {
            padding: 16px; max-width: 900px;
            font-size: 14px; line-height: 1.6; color: var(--text-primary);
        }
        #content .markdown-body h1, #content .markdown-body h2, #content .markdown-body h3 {
            margin-top: 16px; margin-bottom: 8px; font-weight: 600;
        }
        #content .markdown-body h1 { font-size: 1.5em; }
        #content .markdown-body h2 { font-size: 1.3em; }
        #content .markdown-body h3 { font-size: 1.1em; }
        #content .markdown-body p { margin-bottom: 8px; }
        #content .markdown-body pre {
            background: var(--code-bg); border-radius: 6px;
            padding: 12px; overflow-x: auto;
        }
        #content .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9em;
        }
        #content .markdown-body :not(pre) > code {
            background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
        }
        #content .markdown-body a { color: #0969da; }
        #content .markdown-body table { border-collapse: collapse; width: 100%; }
        #content .markdown-body th, #content .markdown-body td {
            border: 1px solid var(--border-color); padding: 6px 12px; text-align: left;
        }
        #content .markdown-body th { background: var(--code-bg); }
        #content .markdown-body blockquote {
            border-left: 3px solid var(--border-color); padding-left: 12px;
            color: var(--text-muted); margin: 8px 0;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="header"></div>
    <div id="tabs">
        <button id="tab-diff" class="active">Diff Preview</button>
        <button id="tab-formatted">Formatted Preview</button>
    </div>
    <div id="content">
        <div class="loading-state">Loading...</div>
    </div>
</div>

<!-- highlight.js and marked.js — local vendor only -->
<link rel="stylesheet" href="/static/vendor/highlight/github.min.css" id="hljs-light-theme">
<link rel="stylesheet" href="/static/vendor/highlight/github-dark.min.css" id="hljs-dark-theme" disabled>
<script src="/static/vendor/highlight/highlight.min.js"></script>
<script src="/static/vendor/marked/marked.min.js"></script>

<script>
(function() {
    // Parse URL params
    var params = new URLSearchParams(window.location.search);
    var worktreeId = params.get('id') || '';
    var filePath = params.get('path') || '';
    var repo = params.get('repo') || '';
    var wtName = params.get('wt_name') || '';
    var branch = params.get('branch') || '';
    var fileName = params.get('file') || filePath.split('/').pop() || '';
    var staged = params.get('staged') === 'true';
    var fullPath = params.get('full_path') || '';
    var activeTab = params.get('tab') || 'diff';

    // Vendor library availability
    var hljsOk = typeof hljs !== 'undefined';
    var markedOk = typeof marked !== 'undefined';

    // Cache for tab content
    var cachedDiff = null;
    var cachedContent = null;
    var contentFileType = 'text/plain';

    // Set page title
    document.title = (fileName || 'File Preview') + ' - myworktree';

    // Render header
    function renderHeader() {
        var h = document.getElementById('header');
        var parts = [];
        if (repo) parts.push('<span>\uD83D\uDCC2 ' + esc(repo) + '</span>');
        if (wtName) parts.push('<span class="sep">/</span> <span>' + esc(wtName) + '</span>');
        if (branch) parts.push('<span class="sep">\u00B7</span> <span class="branch">' + esc(branch) + '</span>');
        if (fileName) parts.push('<span class="sep">\u00B7</span> <span>' + esc(fileName) + '</span>');
        h.innerHTML = '<div class="header-line1">' + (parts.join('') || 'File Preview') + '</div>' +
            '<div class="header-line2">' + esc(fullPath || filePath) + '</div>';
    }

    // Tab switching
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('#tabs button').forEach(function(b) { b.classList.remove('active'); });
        document.getElementById('tab-' + tab).classList.add('active');
        loadTab(tab);
    }

    // Fetch API with auth (same pattern as index.html)
    function apiFetch(url) {
        return fetch(url, { credentials: 'include' });
    }

    function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // Map file extension to highlight.js language
    function extToLang(ext) {
        var m = { '.go': 'go', '.js': 'javascript', '.ts': 'typescript', '.tsx': 'typescript',
            '.jsx': 'javascript', '.py': 'python',
            '.rs': 'rust', '.java': 'java', '.json': 'json', '.yaml': 'yaml', '.yml': 'yaml',
            '.toml': 'ini', '.sh': 'bash', '.bash': 'bash', '.zsh': 'bash',
            '.html': 'xml', '.css': 'css', '.scss': 'css', '.less': 'css',
            '.c': 'c', '.cpp': 'cpp', '.h': 'c', '.hpp': 'cpp',
            '.vue': 'xml', '.svelte': 'xml', '.xml': 'xml', '.svg': 'xml', '.sql': 'sql',
            '.md': 'markdown', '.markdown': 'markdown' };
        return m[ext] || '';
    }

    // Theme switching for highlight.js
    function updateHLJSTheme() {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.getElementById('hljs-light-theme').disabled = dark;
        document.getElementById('hljs-dark-theme').disabled = !dark;
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateHLJSTheme);
    updateHLJSTheme();

    // Load tab content
    function loadTab(tab) {
        var content = document.getElementById('content');
        if (tab === 'diff') {
            if (cachedDiff !== null) { showDiff(cachedDiff); return; }
            content.innerHTML = '<div class="loading-state">Loading diff...</div>';
            var url = '/api/worktree/file/diff?id=' + encodeURIComponent(worktreeId) +
                '&path=' + encodeURIComponent(filePath) +
                '&staged=' + staged;
            apiFetch(url).then(function(resp) {
                if (!resp.ok) return resp.text().then(function(t) { throw new Error(t || resp.statusText); });
                return resp.text();
            }).then(function(text) {
                cachedDiff = text;
                showDiff(text);
            }).catch(function(err) {
                content.innerHTML = '<div class="error-state">' + esc('Failed to load diff: ' + err.message) + '</div>';
            });
        } else {
            if (cachedContent !== null) { showFormatted(cachedContent, contentFileType); return; }
            content.innerHTML = '<div class="loading-state">Loading content...</div>';
            var url = '/api/worktree/file/content?id=' + encodeURIComponent(worktreeId) +
                '&path=' + encodeURIComponent(filePath);
            apiFetch(url).then(function(resp) {
                if (!resp.ok) return resp.text().then(function(t) { throw new Error(t || resp.statusText); });
                var ft = resp.headers.get('X-File-Type') || 'text/plain';
                if (!fullPath) {
                    var fp = resp.headers.get('X-File-FullPath');
                    if (fp) { fullPath = fp; renderHeader(); }
                }
                return resp.text().then(function(t) { return { text: t, fileType: ft }; });
            }).then(function(data) {
                cachedContent = data.text;
                contentFileType = data.fileType;
                showFormatted(data.text, data.fileType);
            }).catch(function(err) {
                content.innerHTML = '<div class="error-state">' + esc('Failed to load content: ' + err.message) + '</div>';
            });
        }
    }

    function showDiff(text) {
        var content = document.getElementById('content');
        if (!text || text.trim() === '') {
            content.innerHTML = '<div class="empty-state">No changes</div>';
            return;
        }
        var pre = document.createElement('pre');
        var code = document.createElement('code');
        code.className = 'language-diff';
        code.textContent = text;
        pre.appendChild(code);
        content.innerHTML = '';
        content.appendChild(pre);
        if (hljsOk) hljs.highlightElement(code);
    }

    function showFormatted(text, fileType) {
        var content = document.getElementById('content');
        if (!text || text.trim() === '') {
            content.innerHTML = '<div class="empty-state">Empty file</div>';
            return;
        }
        if (fileType === 'text/markdown') {
            if (markedOk) {
                content.innerHTML = '<div class="markdown-body">' + marked.parse(text, {sanitize: true}) + '</div>';
                // Highlight code blocks inside markdown
                if (hljsOk) content.querySelectorAll('pre code').forEach(function(block) { hljs.highlightElement(block); });
            } else {
                var pre = document.createElement('pre');
                pre.textContent = text;
                content.innerHTML = '';
                content.appendChild(pre);
            }
        } else if (fileType === 'text/x-code') {
            var ext = filePath.substring(filePath.lastIndexOf('.')).toLowerCase();
            var lang = extToLang(ext);
            var pre = document.createElement('pre');
            var code = document.createElement('code');
            if (lang) code.className = 'language-' + lang;
            code.textContent = text;
            pre.appendChild(code);
            content.innerHTML = '';
            content.appendChild(pre);
            if (lang && hljsOk) hljs.highlightElement(code);
        } else {
            var pre2 = document.createElement('pre');
            pre2.textContent = text;
            content.innerHTML = '';
            content.appendChild(pre2);
        }
    }

    // Tab click handlers
    document.getElementById('tab-diff').addEventListener('click', function() { switchTab('diff'); });
    document.getElementById('tab-formatted').addEventListener('click', function() { switchTab('formatted'); });

    // Init
    renderHeader();
    if (activeTab === 'formatted') {
        document.getElementById('tab-diff').classList.remove('active');
        document.getElementById('tab-formatted').classList.add('active');
    }
    loadTab(activeTab);
})();
</script>
</body>
</html>
